[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxiv-paper-curator"
version = "0.1.0"
description = "Production-grade agentic RAG system for arXiv paper ingestion and retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # arXiv API client
    "arxiv>=2.1.0",
    # HTTP client (PDF download)
    "httpx>=0.27.0",
    # Retry with exponential backoff
    "tenacity>=8.5.0",
    # PDF text extraction (lightweight, no PyTorch)
    "pdfminer.six>=20231228",
    # ORM — sync engine for Airflow/scripts
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    # ORM — async engine for FastAPI
    "asyncpg>=0.29.0",
    # Config + validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    # Env
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"