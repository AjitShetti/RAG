# ─────────────────────────────────────────────────────────────────────────────
# Shared Airflow config applied to all three Airflow services via YAML anchor.
# Change AIRFLOW__CORE__FERNET_KEY before deploying — generate with:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
# ─────────────────────────────────────────────────────────────────────────────
x-airflow-common: &airflow-common
  image: apache/airflow:2.10.3-python3.12
  environment:
    # Use the existing Postgres for Airflow metadata (shares rag_db — tables are non-conflicting)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: "JNkTppspL438JkScXZ5SBPbbt2h_7AXa8lTM2jur3iQ="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    # Install DAG task packages the Airflow-native way (doesn't override core pins)
    _PIP_ADDITIONAL_REQUIREMENTS: "arxiv>=2.1.0 pdfminer.six>=20231228 httpx>=0.27.0 tenacity>=8.5.0 psycopg2-binary>=2.9.9 opensearch-py>=2.4.0 python-dotenv>=1.0.0"
    # arXiv ingestion env vars (read by DAG tasks)
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ARXIV_QUERY: "cs.AI cs.LG cs.CL"
    ARXIV_MAX_RESULTS: "20"
    # App source root inside the container
    APP_ROOT: /opt/airflow/app
    PYTHONPATH: /opt/airflow/app
  volumes:
    # DAG files
    - ./arxiv-paper-curator/airflow/dags:/opt/airflow/dags
    # App source — makes `from src.xxx import …` work in DAG tasks
    - ./arxiv-paper-curator:/opt/airflow/app
    # Airflow logs on host for easy inspection
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - rag-network
  user: "50000:0"   # airflow default UID

services:
  api:
    build:
      context: ./arxiv-paper-curator
      target: runtime
    ports:
      - "8080:8000"
    volumes:
      - ./arxiv-paper-curator:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - ASYNC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - OPENSEARCH_URL=http://opensearch:9200
    networks:
      - rag-network
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - cluster.name=rag-cluster
      - node.name=rag-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'rag-cluster'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: arxiv_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Airflow ──────────────────────────────────────────────────────────────────

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin
      "
    restart: "no"   # one-shot — exits after init

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8090:8080"   # 8090 on host → 8080 inside container
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

networks:
  rag-network:
    driver: bridge

volumes:
  postgres_data:
  opensearch_data:
  redis_data:
  airflow_logs:
